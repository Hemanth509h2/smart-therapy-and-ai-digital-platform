<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320" fill="none">
  <defs>
    <linearGradient id="progressGradient" x1="76" y1="72" x2="250" y2="258" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#20B99F"/>
      <stop offset="1" stop-color="#16B6A4"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#0E9F8E" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- Soft outer halo -->
  <circle cx="160" cy="160" r="146" fill="#F7FCFB"/>
  <circle cx="160" cy="160" r="145" stroke="#E5F5F2" stroke-width="2"/>

  <!-- Subtle decorative dots -->
  <g fill="#BDEFE6" opacity="0.75">
    <circle cx="160" cy="13" r="2"/>
    <circle cx="224" cy="28" r="2"/>
    <circle cx="278" cy="70" r="2"/>
    <circle cx="306" cy="130" r="2"/>
    <circle cx="303" cy="207" r="2"/>
    <circle cx="268" cy="267" r="2"/>
    <circle cx="210" cy="299" r="2"/>
    <circle cx="143" cy="306" r="2"/>
    <circle cx="79" cy="286" r="2"/>
    <circle cx="35" cy="239" r="2"/>
    <circle cx="14" cy="174" r="2"/>
    <circle cx="25" cy="107" r="2"/>
    <circle cx="63" cy="52" r="2"/>
    <circle cx="110" cy="24" r="2"/>
  </g>

  <!-- Progress track -->
  <circle
    cx="160" cy="160" r="112"
    stroke="#EEF5F4"
    stroke-width="14"
    fill="none"
  />

  <!-- Progress: approximately 72% -->
  <circle
    cx="160" cy="160" r="112"
    stroke="url(#progressGradient)"
    stroke-width="14"
    stroke-linecap="round"
    fill="none"
    stroke-dasharray="506 198"
    stroke-dashoffset="72"
    transform="rotate(-90 160 160)"
    filter="url(#softShadow)"
  />
</svg>