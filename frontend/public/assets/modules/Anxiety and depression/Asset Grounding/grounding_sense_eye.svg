<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="eyeGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#20C59A"/>
      <stop offset="100%" stop-color="#08A97F"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-30%" width="140%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#0A9E7A" flood-opacity=".16"/>
    </filter>
  </defs>

  <!-- Eye / See icon for 5-4-3-2-1 Grounding Exercise -->
  <g filter="url(#softShadow)">
    <!-- eye shape -->
    <path d="M28 128
             C54 88 94 65 128 65
             C162 65 202 88 228 128
             C202 168 162 191 128 191
             C94 191 54 168 28 128Z"
          fill="url(#eyeGreen)"/>

    <!-- white iris ring -->
    <circle cx="128" cy="128" r="42" fill="#FFFFFF"/>

    <!-- green pupil -->
    <circle cx="128" cy="128" r="22" fill="#0B9F7B"/>

    <!-- subtle pupil highlight -->
    <circle cx="120" cy="120" r="6" fill="#FFFFFF" opacity=".9"/>
  </g>
</svg>