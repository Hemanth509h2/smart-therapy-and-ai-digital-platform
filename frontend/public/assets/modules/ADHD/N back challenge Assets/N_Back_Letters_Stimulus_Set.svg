<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
<rect width="100%" height="100%" fill="#fafaff"/>
<defs>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
<feDropShadow dx="0" dy="6" stdDeviation="8" flood-opacity="0.18"/>
</filter>
</defs>

<!-- cards and letters -->
<g font-family="Arial" font-weight="700" font-size="96" text-anchor="middle">
<g fill="#3046E8">
<rect x="80" y="80" width="180" height="180" rx="30" fill="white" stroke="#e8e6f5" filter="url(#shadow)"/><text x="170" y="195">A</text>
<rect x="80" y="320" width="180" height="180" rx="30" fill="white" stroke="#e8e6f5" filter="url(#shadow)"/><text x="170" y="435">F</text>
</g>
<g fill="#7138E8">
<rect x="300" y="80" width="180" height="180" rx="30" fill="white" stroke="#e8e6f5" filter="url(#shadow)"/><text x="390" y="195">B</text>
<rect x="300" y="320" width="180" height="180" rx="30" fill="white" stroke="#e8e6f5" filter="url(#shadow)"/><text x="390" y="435">G</text>
</g>
<g fill="#16A878">
<rect x="520" y="80" width="180" height="180" rx="30" fill="white" stroke="#e8e6f5" filter="url(#shadow)"/><text x="610" y="195">C</text>
<rect x="520" y="320" width="180" height="180" rx="30" fill="white" stroke="#e8e6f5" filter="url(#shadow)"/><text x="610" y="435">H</text>
</g>
<g fill="#F39A18">
<rect x="740" y="80" width="180" height="180" rx="30" fill="white" stroke="#e8e6f5" filter="url(#shadow)"/><text x="830" y="195">D</text>
<rect x="740" y="320" width="180" height="180" rx="30" fill="white" stroke="#e8e6f5" filter="url(#shadow)"/><text x="830" y="435">I</text>
</g>
<g fill="#E83D45">
<rect x="960" y="80" width="180" height="180" rx="30" fill="white" stroke="#e8e6f5" filter="url(#shadow)"/><text x="1050" y="195">E</text>
<rect x="960" y="320" width="180" height="180" rx="30" fill="white" stroke="#e8e6f5" filter="url(#shadow)"/><text x="1050" y="435">J</text>
</g>
</g>
</svg>