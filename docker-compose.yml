# =============================================================================
# STAAD - run the website, backend API and AI service with Docker Compose
# =============================================================================
#
# Before the first start:
#   1. Copy .env.example to .env in backend-express/, frontend/ and ai/ and fill
#      them in.
#   2. Optional: copy .env.example to .env next to this file and set the public
#      addresses. Without it everything runs on localhost.
#
# Start everything (builds the images the first time):
#   docker compose up -d --build
#
# Watch the logs:
#   docker compose logs -f
#   docker compose logs -f backend        (one service only)
#
# See which services are running and healthy:
#   docker compose ps
#
# Update after a git pull:
#   docker compose up -d --build
#
# Stop everything:
#   docker compose down
#
# Where each part is reachable (defaults):
#   http://localhost:3000     website            (frontend)
#   http://localhost:4000     API, /api/...      (backend)
#   http://localhost:4100     speech-to-text and AI (ai)
#
# The containers talk to each other by service name (http://ai:4100, ...).
# Inside a container, "localhost" means that container itself.
#
# There is no HTTPS here. On a public server, put a reverse proxy with HTTPS
# in front of the three ports and set WEBSITE_URL, API_URL and AI_URL in .env
# to the https:// addresses. Browsers only allow the camera and microphone on
# https:// pages or on localhost.
# =============================================================================


# Shared log settings: each service keeps at most 3 log files of 10 MB, so the
# logs can never fill the disk.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"


services:

  # ---------------------------------------------------------------------------
  # Backend API (Express + Prisma)
  # ---------------------------------------------------------------------------
  backend:
    build: ./backend-express
    ports:
      - "4000:4000"
    volumes:
      # Your settings, read-only. src/server.ts (dotenv) loads this file on start.
      - ./backend-express/.env:/app/.env:ro
    environment:
      # These replace the values in backend-express/.env.
      # Links in emails (invites, join links, password reset) use this address.
      APP_URL: ${WEBSITE_URL:-http://localhost:3000}
      # The website's address, allowed to call the API.
      ALLOWED_ORIGINS: ${WEBSITE_URL:-http://localhost:3000}
      # The backend reaches the AI service by its service name: AI insights,
      # session reports and the admin health check.
      STT_RELAY_URL: http://ai:4100
    depends_on:
      - ai
    restart: unless-stopped
    logging: *logging

  # ---------------------------------------------------------------------------
  # Website (Next.js)
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      args:
        # Built into the website's JavaScript, so the browser must be able to
        # reach these addresses. They replace the values in frontend/.env; the
        # rest of frontend/.env (Firebase, LiveKit) is used as it is.
        # Changing them needs a rebuild: docker compose up -d --build frontend
        NEXT_PUBLIC_API_URL: ${API_URL:-http://localhost:4000}
        NEXT_PUBLIC_STT_RELAY_URL: ${AI_URL:-http://localhost:4100}
    ports:
      - "3000:3000"
    depends_on:
      - backend
      - ai
    restart: unless-stopped
    logging: *logging

  # ---------------------------------------------------------------------------
  # AI service (Python + gunicorn): speech-to-text relay, call-plan agent,
  # AI insights and session reports.
  # ---------------------------------------------------------------------------
  ai:
    build: ./ai
    ports:
      - "4100:4100"
    # Your settings from ai/.env become environment variables.
    env_file: ./ai/.env
    environment:
      # Always production, whatever ai/.env says, so the token check stays on.
      NODE_ENV: production
      # Only the website may open speech-to-text connections.
      ALLOWED_ORIGINS: ${WEBSITE_URL:-http://localhost:3000}
    restart: unless-stopped
    logging: *logging
